odroidgoa-uboot-config

setenv bootargs "boot=LABEL=ROCKNIX disk=LABEL=STORAGE quiet console=ttyS2,115200 console=tty0 systemd.debug_shell=ttyS2"

setenv loadaddr "0x02000000"
setenv dtb_loadaddr "0x01f00000"
setenv dtbo_loadaddr "0x01e00000"
setenv initrd_loadaddr "0x04000000"
setenv once_addr "0x02100000"

# R36S LightOS, once. LIGHTOS.TXT in the root of this partition starts with
# "L" and a token that changes each time it is armed. U-Boot boots LightOS
# (lightos/Image with its device tree, or ROCKNIX's KERNEL if there is
# none, with lightos/initrd.img, and lightos/mipi-panel.dtbo if it is
# there) only
# for a token it has not booted yet: it keeps the first 64 bytes of the last
# LIGHTOS.TXT it booted in sector 31 of this partition, a reserved FAT32
# sector nothing else uses, and writes them there before booting. So the
# next power-on is ROCKNIX whatever LightOS does. The sector is written raw:
# this U-Boot's 2017 fatwrite misses existing upper-case 8.3 names and
# appends a duplicate entry instead of overwriting.
setenv initrd "-"
setenv kernel "KERNEL"
setenv dtbo "overlays/mipi-panel.dtbo"
setenv dtb_file "rk3326-gameconsole-r36s.dtb"
if load mmc 1:1 ${loadaddr} LIGHTOS.TXT; then
  if itest.b *${loadaddr} == 0x4c; then
    if itest ${filesize} -ge 40; then
      if part start mmc 1 1 once_sect; then
        setexpr once_sect ${once_sect} + 1f
        mmc dev 1
        if mmc read ${once_addr} ${once_sect} 1; then
          if cmp.b ${loadaddr} ${once_addr} 40; then
            echo "LightOS: this LIGHTOS.TXT was booted already"
          else
            # Only over an empty sector or one this script wrote.
            setenv once_ok 0
            if itest.l *${once_addr} == 0; then
              setenv once_ok 1
            fi
            if itest.b *${once_addr} == 0x4c; then
              setenv once_ok 1
            fi
            if test ${once_ok} = 1; then
              if load mmc 1:1 ${initrd_loadaddr} lightos/initrd.img; then
                cp.b ${loadaddr} ${once_addr} 40
                if mmc write ${once_addr} ${once_sect} 1; then
                  setenv initrd ${initrd_loadaddr}
                  setenv bootargs "rdinit=/lightos/init quiet panic=10 initcall_debug log_buf_len=1M console=ttyS2,115200 console=tty0"
                  if test -e mmc 1:1 lightos/Image; then
                    setenv kernel "lightos/Image"
                    # Its device tree, built with it: never with KERNEL.
                    if test -e mmc 1:1 lightos/rk3326-gameconsole-r36s.dtb; then
                      setenv dtb_file "lightos/rk3326-gameconsole-r36s.dtb"
                    fi
                  fi
                  # The same panel with shorter delays, from
                  # tools/build_panel_overlay.sh.
                  if test -e mmc 1:1 lightos/mipi-panel.dtbo; then
                    setenv dtbo "lightos/mipi-panel.dtbo"
                  fi
                fi
              fi
            fi
          fi
        fi
      fi
    fi
  fi
fi

load mmc 1:1 ${loadaddr} ${kernel}

if test ${hwrev} = 'v11'; then
  if gpio input c22; then
    if gpio input d9; then
      load mmc 1:1 ${dtb_loadaddr} rk3326-powkiddy-rgb10.dtb
    else
      load mmc 1:1 ${dtb_loadaddr} rk3326-odroid-go2-v11.dtb
    fi
  else
    load mmc 1:1 ${dtb_loadaddr} rk3326-anbernic-rg351m.dtb
  fi
elif test ${hwrev} = 'v10-go3'; then
  load mmc 1:1 ${dtb_loadaddr} rk3326-odroid-go3.dtb
elif test ${hwrev} = 'v10'; then
  load mmc 1:1 ${dtb_loadaddr} rk3326-odroid-go2.dtb
elif test ${hwrev} = 'rg351v'; then
  load mmc 1:1 ${dtb_loadaddr} rk3326-anbernic-rg351v.dtb
elif test ${hwrev} = 'r33s'; then
#   load mmc 1:1 ${dtb_loadaddr} rk3326-powkiddy-rgb20s.dtb
    load mmc 1:1 ${dtb_loadaddr} rk3326-gameconsole-r33s.dtb
elif test ${hwrev} = 'xu10'; then
  load mmc 1:1 ${dtb_loadaddr} rk3326-magicx-xu10.dtb
elif test ${hwrev} = 'chi'; then
  load mmc 1:1 ${dtb_loadaddr} rk3326-gameforce-chi.dtb
fi

# R36S: always use its own device tree (no hwrev branch for it); LightOS's
# kernel brings its own.
load mmc 1:1 ${dtb_loadaddr} ${dtb_file}

if load mmc 1:1 ${dtbo_loadaddr} ${dtbo}; then
  fdt addr ${dtb_loadaddr}
  fdt resize 8192
  fdt apply ${dtbo_loadaddr}
fi

booti ${loadaddr} ${initrd} ${dtb_loadaddr}
